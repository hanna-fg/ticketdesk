<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TicketDesk</title>

  <!--
    98.css provides the Windows 98 styling for windows,
    buttons, fieldsets and title bars.
  -->
  <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.20/dist/98.css">

  <!--
    Supabase client library. The browser reads and writes
    directly to the Supabase database; no separate server is needed.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <style>
    body     { background: #e9e9e6; padding: 16px; max-width: 1400px; margin: auto; }

    /* Two columns side by side; one column on narrow screens (phones). */
    #app         { display: grid; grid-template-columns: 2fr 3fr; gap: 16px; align-items: start; }
    #app[hidden] { display: none; }
    .column      { min-width: 0; }
    /* On phones the right column (Timeline, Today, ...) comes first. */
    @media (max-width: 900px) { #app { grid-template-columns: 1fr; } .column:last-child { order: -1; } }
    #loginWindow { max-width: 480px; margin: 40px auto; }

    h4       { font-size: 15px; margin: 8px 0; }
    .day     { margin-top: 12px; padding-bottom: 2px; border-bottom: 1px solid #808080;
               display: flex; justify-content: space-between; font-weight: bold; }
    .window  { margin-bottom: 16px; }
    .ticket  { margin: 6px 0; }
    .meta    { color: #555; font-size: 11px; }
    .slip    { color: darkred; font-weight: bold; }
    .soon    { background: darkred; color: white; padding: 0 4px; }
    .done    { text-decoration: line-through; color: gray; }
    .row     { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
    textarea { width: 100%; min-height: 50px; }
    summary  { cursor: pointer; }
    #projectList details { margin: 6px 0; }
    input, select, textarea { max-width: 100%; min-width: 0; box-sizing: border-box; }

    /* 98.css lays out checkbox labels with flex, which drops the space
       between the time and the title; `gap` puts it back. */
    .ticket input[type=checkbox] + label { gap: 4px; }

    /* Timeline: one row per project. A bar spans start → deadline,
       dots mark planned tickets, the red line marks today. */
    .tl-row   { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; margin: 4px 0; }
    .tl-name  { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tl-track { position: relative; height: 18px; background: white; box-shadow: inset 1px 1px #808080; }
    .tl-scale { position: relative; height: 14px; font-size: 10px; color: #555; }
    .tl-scale span { position: absolute; }
    .tl-bar   { position: absolute; top: 5px; height: 8px; background: #000080; }
    .tl-dot   { position: absolute; top: 2px; width: 5px; height: 12px; margin-left: -3px; background: gold; border: 1px solid black; }
    .tl-dot.done { background: silver; }
    .tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: darkred; }
  </style>
</head>
<body>


<!-- ═══════════════════════════════════════════════════════
     SIGN-IN WINDOW
     Shown until the user signs in. No password is required.
     The sign-in email contains a link and a code; either one works.
     The code is for places the link can't reach, such as an app
     added to the iPhone home screen.
     ═══════════════════════════════════════════════════════ -->
<div class="window" id="loginWindow">
  <div class="title-bar">
    <div class="title-bar-text">Welcome</div>
  </div>
  <div class="window-body">
    <p>Type your email. Supabase sends a sign-in link and code.</p>
    <div class="row">
      <input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" style="flex:1">
      <button onclick="signIn()">Send email</button>
    </div>
    <div class="row">
      <input id="codeInput" inputmode="numeric" autocomplete="one-time-code" placeholder="Code from the email" style="flex:1">
      <button onclick="signInWithCode()">Sign in with code</button>
    </div>
    <p id="loginMessage"></p>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════
     THE APP
     Everything below is hidden until sign-in succeeds.
     Left column:  Next 7 days.
     Right column: Timeline, Today, New ticket, Projects, Backlog.
     ═══════════════════════════════════════════════════════ -->
<div id="app" hidden>

<div class="column">

<!-- ─── NEXT 7 DAYS: one block per day, tickets editable ─── -->
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Next 7 days</div>
    </div>
    <div class="window-body" id="week"></div>
  </div>

</div>
<div class="column">

<!-- ─── TIMELINE: projects as bars, planned tickets as dots ─── -->
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Timeline</div>
    </div>
    <div class="window-body" id="timeline"></div>
  </div>

<!-- ─── TODAY: tickets planned for today ─── -->
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Today.exe</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="signOut()"></button>
      </div>
    </div>
    <div class="window-body">
      <div id="carriedOver"></div>
      <div id="todayList"></div>
    </div>
  </div>

<!-- ─── NEW TICKET: form to create a ticket ─── -->
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">New ticket</div>
    </div>
    <div class="window-body">
      <div class="row">
        <input id="newTitle" placeholder="What needs doing?" style="flex:1">
      </div>
      <div class="row">
        <select id="projectPicker"></select>
        Importance
        <select id="importancePicker">
          <option value="1">Low</option>
          <option value="2" selected>Med</option>
          <option value="3">High</option>
        </select>
        Urgency
        <select id="urgencyPicker">
          <option value="1">Low</option>
          <option value="2" selected>Med</option>
          <option value="3">High</option>
        </select>
      </div>
      <div class="row">
        Plan for <input type="date" id="planDate">
        at <input type="time" id="startTime">
        <span class="meta">(leave the date empty → backlog)</span>
      </div>
      <textarea id="newDescription" placeholder="Description (optional)"></textarea>
      <div class="row">
        <button onclick="addTicket()">Add ticket</button>
      </div>
    </div>
  </div>

<!-- ─── PROJECTS: list + create ─── -->
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Projects</div>
    </div>
    <div class="window-body">
      <div id="projectList"></div>
      <fieldset>
        <legend>New project</legend>
        <div class="row">
          <input id="newProjectName" placeholder="Project name" style="flex:1">
        </div>
        <div class="row">
          Start <input type="date" id="projectStart">
          Deadline <input type="date" id="projectDeadline">
          <button onclick="addProject()">Add project</button>
        </div>
      </fieldset>
    </div>
  </div>

<!-- ─── BACKLOG: unplanned tickets ─── -->
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Backlog</div>
    </div>
    <div class="window-body" id="backlogList"></div>
  </div>

</div>

</div>


<script>
// ┌──────────────────────────────────────────────────────────────┐
// │  SECTION 1: CONFIGURATION                                   │
// │                                                              │
// │  Connection settings for the Supabase project.               │
// │  Both values are listed under                                │
// │  Supabase → Project Settings → API.                          │
// │                                                              │
// │  The anon key is designed to be public. The row-level        │
// │  security rules in setup.sql limit each signed-in user       │
// │  to their own data.                                          │
// └──────────────────────────────────────────────────────────────┘
const SUPABASE_URL = "https://digbrvbkfxtoxcbstwuu.supabase.co";
const SUPABASE_KEY = "sb_publishable_cV58vNw_svmExXnjpiTsog_fy0DMTaC";


// ┌──────────────────────────────────────────────────────────────┐
// │  SECTION 2: DATABASE CONNECTION                              │
// │                                                              │
// │  `db` is the Supabase connection used below to read and      │
// │  write data.                                                 │
// │  `data` holds everything currently loaded from the database. │
// └──────────────────────────────────────────────────────────────┘
const db   = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let   data = { projects: [], tickets: [] };


// ┌──────────────────────────────────────────────────────────────┐
// │  SECTION 3: AUTHENTICATION                                  │
// │                                                              │
// │  signIn(): emails a sign-in link and code.                   │
// │  signInWithCode(): signs in with the code from that email.   │
// │  signOut(): signs out and reloads the page.                  │
// │  onAuthStateChange: runs whenever sign-in status changes     │
// │    and shows or hides the app accordingly.                   │
// └──────────────────────────────────────────────────────────────┘

// Prefill the email typed last time on this device.
try { document.getElementById("emailInput").value = localStorage.getItem("email") || ""; } catch {}

async function signIn() {
  const email = document.getElementById("emailInput").value.trim();
  try { localStorage.setItem("email", email); } catch {}

  // Request a sign-in email from Supabase.
  // Opening its link returns the user to this page, signed in.
  const { error } = await db.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: location.origin + location.pathname }
  });

  document.getElementById("loginMessage").textContent = error
    ? "Couldn't send the email: " + error.message
    : "Check your inbox: tap the link, or type the code above.";
}

async function signInWithCode() {
  const email = document.getElementById("emailInput").value.trim();
  const token = document.getElementById("codeInput").value.trim();

  // On success, onAuthStateChange (below) opens the app.
  const { error } = await db.auth.verifyOtp({ email, token, type: "email" });

  if (error) {
    document.getElementById("loginMessage").textContent = "Code didn't work: " + error.message;
  }
}

async function signOut() {
  await db.auth.signOut();
  location.reload();
}

// Runs on page load and on every sign-in or sign-out.
// Signed in → hide login, show app, load data.
// Signed out → show login, hide app.
db.auth.onAuthStateChange((_event, session) => {
  document.getElementById("loginWindow").hidden = !!session;
  document.getElementById("app").hidden          = !session;
  if (session) loadAllData();
});


// ┌──────────────────────────────────────────────────────────────┐
// │  SECTION 4: SMALL HELPERS                                   │
// │                                                              │
// │  Short utility functions used throughout the code below.     │
// └──────────────────────────────────────────────────────────────┘

// Today's date as "2026-11-08" (the format Supabase uses).
function today() {
  return new Date().toLocaleDateString("sv-SE");
}

// How many days between two date strings. Positive = b is later.
function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

// Priority score: importance × urgency. Ranges 1 (low/low) to 9 (high/high).
function priority(ticket) {
  return ticket.importance * ticket.urgency;
}

// "14:00:00" → "14:00" (drop the seconds Supabase stores).
function shortTime(time) {
  return time ? time.slice(0, 5) : "";
}

// Find a ticket by its database ID.
function findTicket(id) {
  return data.tickets.find(t => t.id === id);
}

// Look up which project a ticket belongs to.
function projectName(projectId) {
  const match = data.projects.find(p => p.id === projectId);
  return match ? match.name : "No project";
}

// Escape HTML so user-typed text can't break the page.
function esc(text) {
  return String(text ?? "").replace(/[&<>"]/g, c => "&#" + c.charCodeAt(0) + ";");
}

// How long a project runs, in human words.
function projectLength(project) {
  if (!project.start_date || !project.deadline) return "";
  const days = daysBetween(project.start_date, project.deadline) + 1;
  return days >= 14 ? Math.round(days / 7) + " weeks" : days + " days";
}

// A date string moved by some days: addDays("2026-11-08", 7) → "2026-11-15".
function addDays(date, days) {
  const d = new Date(date + "T12:00");
  d.setDate(d.getDate() + days);
  return d.toLocaleDateString("sv-SE");
}

// <option> list for the Low / Med / High pickers, with `selected` chosen.
function levelOptions(selected) {
  return [[1, "Low"], [2, "Med"], [3, "High"]].map(([value, label]) =>
    `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`
  ).join("");
}

// <option> list for a project picker, with `selected` chosen.
function projectOptions(selected) {
  return `<option value="">No project</option>` + data.projects.map(p =>
    `<option value="${p.id}" ${p.id === selected ? "selected" : ""}>${esc(p.name)}</option>`
  ).join("");
}

// How many minutes until a timed ticket starts.
// Returns null if the ticket has no time or isn't planned for today.
function minutesUntilStart(ticket) {
  if (!ticket.start_time || ticket.planned_for !== today()) return null;
  const [hours, minutes] = ticket.start_time.split(":").map(Number);
  const now = new Date();
  return (hours * 60 + minutes) - (now.getHours() * 60 + now.getMinutes());
}


// ┌──────────────────────────────────────────────────────────────┐
// │  SECTION 5: LOADING DATA                                    │
// │                                                              │
// │  Pulls all projects and tickets from Supabase,               │
// │  stores them in `data`, then redraws the page.               │
// │  Called once on sign-in, and again after every change.       │
// └──────────────────────────────────────────────────────────────┘

async function loadAllData() {
  const projectRows = await db.from("projects").select("*").order("created_at");
  const ticketRows  = await db.from("tickets").select("*").order("created_at");

  if (projectRows.error || ticketRows.error) {
    alert("Couldn't load: " + (projectRows.error || ticketRows.error).message);
    return;
  }

  data = {
    projects: projectRows.data,
    tickets:  ticketRows.data
  };

  render();
}


// ┌──────────────────────────────────────────────────────────────┐
// │  SECTION 6: SAVING CHANGES                                  │
// │                                                              │
// │  Three functions that every action below uses:               │
// │  - insertRow: add a new row to a table.                      │
// │  - updateRow: change fields on an existing row.              │
// │  - deleteRow: remove a row.                                  │
// │  Each saves to the database, then reloads everything.        │
// │  Tables: "projects" and "tickets".                           │
// └──────────────────────────────────────────────────────────────┘

async function insertRow(table, newRow) {
  const { error } = await db.from(table).insert(newRow);
  if (error) alert("Couldn't save: " + error.message);
  await loadAllData();
}

async function updateRow(table, id, fieldsToChange) {
  const { error } = await db.from(table).update(fieldsToChange).eq("id", id);
  if (error) alert("Couldn't save: " + error.message);
  await loadAllData();
}

async function deleteRow(table, id) {
  const { error } = await db.from(table).delete().eq("id", id);
  if (error) alert("Couldn't delete: " + error.message);
  await loadAllData();
}

// Shortcut used by most ticket actions.
function updateTicket(id, fieldsToChange) {
  return updateRow("tickets", id, fieldsToChange);
}


// ┌──────────────────────────────────────────────────────────────┐
// │  SECTION 7: USER ACTIONS                                    │
// │                                                              │
// │  One function per user action. Each reads the form,          │
// │  writes to the database, and the page redraws via            │
// │  loadAllData().                                              │
// └──────────────────────────────────────────────────────────────┘

// ── Create a new project ──
function addProject() {
  const name = document.getElementById("newProjectName").value.trim();
  if (!name) return;

  insertRow("projects", {
    name,
    start_date: document.getElementById("projectStart").value   || null,
    deadline:   document.getElementById("projectDeadline").value || null
  });

  document.getElementById("newProjectName").value = "";
}

// ── Create a new ticket ──
function addTicket() {
  const title = document.getElementById("newTitle").value.trim();
  if (!title) return;

  const plannedFor = document.getElementById("planDate").value || null;

  insertRow("tickets", {
    title,
    project_id:      Number(document.getElementById("projectPicker").value) || null,
    importance:       Number(document.getElementById("importancePicker").value),
    urgency:          Number(document.getElementById("urgencyPicker").value),
    planned_for:      plannedFor,
    start_time:       document.getElementById("startTime").value || null,
    added_to_backlog: plannedFor ? null : today(),   // no date = goes straight to backlog
    description:      document.getElementById("newDescription").value
  });

  document.getElementById("newTitle").value       = "";
  document.getElementById("newDescription").value = "";
}

// ── Check or uncheck a ticket ──
function toggleDone(id) {
  const ticket = findTicket(id);
  updateTicket(id, { done: !ticket.done });
}

// ── Move a carried-over ticket to today ──
// If it was planned for an earlier day, that counts as a slip.
function moveToToday(id) {
  const ticket  = findTicket(id);
  const wasLate = ticket.planned_for && ticket.planned_for < today();

  updateTicket(id, {
    planned_for: today(),
    slips:       ticket.slips + (wasLate ? 1 : 0)
  });
}

// ── Send a ticket back to the backlog ──
// If it was planned for today or earlier, that counts as a slip
// (planned but not done). Unplanning a future day is not a slip.
function moveToBacklog(id) {
  const ticket = findTicket(id);
  const slipped = ticket.planned_for && ticket.planned_for <= today();

  updateTicket(id, {
    planned_for:      null,
    start_time:       null,
    added_to_backlog: today(),
    slips:            ticket.slips + (slipped ? 1 : 0)
  });
}

// ── Plan a backlog ticket for the date picked next to it ──
function planFor(id) {
  const date = document.getElementById("plan-" + id).value;
  if (date) updateTicket(id, { planned_for: date });
}

// ── Save edits inside a ticket's "Details" panel ──
function saveDetails(id) {
  const ticket     = findTicket(id);
  const field      = name => document.getElementById(name + "-" + id).value;
  const plannedFor = field("date") || null;

  updateTicket(id, {
    title:       field("title").trim() || ticket.title,   // never save an empty title
    project_id:  Number(field("proj")) || null,
    importance:  Number(field("imp")),
    urgency:     Number(field("urg")),
    description: field("desc"),
    planned_for: plannedFor,
    start_time:  plannedFor ? (field("time") || null) : null,   // no date → no time
    // Clearing the date sends the ticket to the backlog; its waiting count starts today.
    added_to_backlog: (!plannedFor && ticket.planned_for) ? today() : ticket.added_to_backlog
  });
}

// ── Delete a ticket permanently ──
function deleteTicket(id) {
  if (!confirm("Delete this ticket?")) return;
  deleteRow("tickets", id);
}

// ── Save edits inside a project's "Edit" panel ──
function saveProject(id) {
  const name = document.getElementById("pname-" + id).value.trim();
  if (!name) return;

  updateRow("projects", id, {
    name,
    start_date: document.getElementById("pstart-" + id).value || null,
    deadline:   document.getElementById("pend-" + id).value   || null
  });
}

// ── Delete a project permanently ──
// The database also deletes its tickets (see "on delete cascade" in setup.sql).
function deleteProject(id) {
  const count = data.tickets.filter(t => t.project_id === id).length;
  if (!confirm(`Delete this project and its ${count} tickets?`)) return;
  deleteRow("projects", id);
}

// ── Add a checklist step to a ticket ──
function addChecklistItem(id) {
  const input = document.getElementById("item-" + id);
  if (!input.value.trim()) return;

  const currentList = findTicket(id).checklist;
  const updated     = [...currentList, { text: input.value.trim(), done: false }];
  updateTicket(id, { checklist: updated });
}

// ── Toggle one checklist step done or undone ──
function toggleChecklistItem(ticketId, stepIndex) {
  const currentList = findTicket(ticketId).checklist;
  const updated = currentList.map((item, i) =>
    i === stepIndex ? { ...item, done: !item.done } : item
  );
  updateTicket(ticketId, { checklist: updated });
}


// ┌──────────────────────────────────────────────────────────────┐
// │  SECTION 8: RENDERING                                       │
// │                                                              │
// │  Turns `data` into HTML. Called after every change.          │
// │  This section only reads data; it never changes it.          │
// └──────────────────────────────────────────────────────────────┘

// ── Sorting rule: timed tickets first (by time), then by priority ──
function sortByTimeThenPriority(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;                          // done → bottom
  if (!!a.start_time !== !!b.start_time) return a.start_time ? -1 : 1;    // timed → top
  if (a.start_time && b.start_time) {                                     // earlier time first
    const cmp = a.start_time.localeCompare(b.start_time);
    if (cmp !== 0) return cmp;
  }
  return priority(b) - priority(a);                                        // higher priority first
}

// ── Build the HTML for one ticket ──
// `buttons` is the action HTML at the bottom (different per section).
function ticketHTML(ticket, buttons) {
  const doneSteps   = ticket.checklist.filter(i => i.done).length;
  const totalSteps  = ticket.checklist.length;
  const minutesLeft = minutesUntilStart(ticket);

  // Checklist rows
  const checklistRows = ticket.checklist.map((item, i) => `
    <div>
      <input type="checkbox" id="c-${ticket.id}-${i}"
             ${item.done ? "checked" : ""}
             onclick="toggleChecklistItem(${ticket.id}, ${i})">
      <label for="c-${ticket.id}-${i}" class="${item.done ? "done" : ""}">
        ${esc(item.text)}
      </label>
    </div>`
  ).join("");

  return `
    <fieldset class="ticket">

      <!-- Title row: checkbox, time, name, and optional "in X min" badge -->
      <div class="row">
        <input type="checkbox" id="t-${ticket.id}"
               ${ticket.done ? "checked" : ""}
               onclick="toggleDone(${ticket.id})">
        <label for="t-${ticket.id}" class="${ticket.done ? "done" : ""}">
          ${ticket.start_time ? `<b>${shortTime(ticket.start_time)}</b> ` : ""}
          <b>${esc(ticket.title)}</b>
        </label>
        ${(!ticket.done && minutesLeft > 0 && minutesLeft <= 60)
          ? `<span class="soon">in ${minutesLeft} min</span>`
          : ""}
      </div>

      <!-- Info line: project, priority score, checklist progress, slips, lateness -->
      <div class="meta">
        ${esc(projectName(ticket.project_id))}
        · priority ${priority(ticket)}/9
        ${totalSteps   ? ` · ${doneSteps}/${totalSteps} steps` : ""}
        ${ticket.slips ? `<span class="slip"> · slipped ${ticket.slips}×</span>` : ""}
        ${(!ticket.planned_for && ticket.added_to_backlog)
          ? ` · in backlog ${daysBetween(ticket.added_to_backlog, today())} days`
          : ""}
        ${(ticket.planned_for && ticket.planned_for < today() && !ticket.done)
          ? `<span class="slip"> · ${daysBetween(ticket.planned_for, today())} days late</span>`
          : ""}
      </div>

      <!-- Expandable panel: edit every field, then the checklist -->
      <details>
        <summary>Details and checklist</summary>
        <div class="row">
          <input id="title-${ticket.id}" value="${esc(ticket.title)}" style="flex:1">
        </div>
        <div class="row">
          <select id="proj-${ticket.id}">${projectOptions(ticket.project_id)}</select>
          Importance <select id="imp-${ticket.id}">${levelOptions(ticket.importance)}</select>
          Urgency    <select id="urg-${ticket.id}">${levelOptions(ticket.urgency)}</select>
        </div>
        <textarea id="desc-${ticket.id}"
                  placeholder="Description">${esc(ticket.description)}</textarea>
        <div class="row">
          Plan for <input type="date" id="date-${ticket.id}" value="${ticket.planned_for || ""}">
          at       <input type="time" id="time-${ticket.id}" value="${shortTime(ticket.start_time)}">
        </div>
        <div class="row">
          <button onclick="saveDetails(${ticket.id})">Save</button>
          <button onclick="deleteTicket(${ticket.id})">Delete ticket</button>
        </div>
        ${checklistRows}
        <div class="row">
          <input id="item-${ticket.id}" placeholder="Small step">
          <button onclick="addChecklistItem(${ticket.id})">Add step</button>
        </div>
      </details>

      <div class="row">${buttons}</div>
    </fieldset>`;
}


// ── Main render: rebuild all four windows from current data ──
function render() {
  const openTickets = data.tickets.filter(t => !t.done);
  const totalSlips  = data.tickets.reduce((sum, t) => sum + t.slips, 0);


  // Fill the project dropdown in the "New ticket" form.
  document.getElementById("projectPicker").innerHTML =
    data.projects.map(p =>
      `<option value="${p.id}">${esc(p.name)}</option>`
    ).join("");

  // Default the plan date to today if the field is empty.
  const planInput = document.getElementById("planDate");
  if (!planInput.value) planInput.value = today();


  // ── CARRIED OVER ──
  // Tickets planned for an earlier day that still aren't done.
  // Each can be moved to today or back to the backlog; either counts a slip.
  const carriedOver = openTickets.filter(t =>
    t.planned_for && t.planned_for < today()
  );

  document.getElementById("carriedOver").innerHTML = carriedOver.length
    ? "<h4>Carried over</h4>" +
      carriedOver.map(t => ticketHTML(t,
        `<button onclick="moveToToday(${t.id})">Do today</button>
         <button onclick="moveToBacklog(${t.id})">Back to backlog</button>`
      )).join("")
    : "";


  // ── TODAY ──
  // Tickets planned for today, sorted: timed first, then by priority.
  const todaysTickets = data.tickets
    .filter(t => t.planned_for === today())
    .sort(sortByTimeThenPriority);

  const doneCount = todaysTickets.filter(t => t.done).length;

  document.getElementById("todayList").innerHTML =
    `<h4>Today · ${doneCount}/${todaysTickets.length} done` +
    ` · ${totalSlips} slips total</h4>` +
    (todaysTickets.length
      ? todaysTickets.map(t => ticketHTML(t,
          `<button onclick="moveToBacklog(${t.id})">Not today</button>`
        )).join("")
      : "<p>Nothing planned yet.</p>");


  // ── NEXT 7 DAYS ──
  // One block per day after today: weekday, date, then that day's tickets.
  // Each ticket is fully editable through its Details panel.
  document.getElementById("week").innerHTML =
    [1, 2, 3, 4, 5, 6, 7].map(offset => {
      const day     = addDays(today(), offset);
      const weekday = new Date(day + "T12:00").toLocaleDateString("en-GB", { weekday: "long" });
      const tickets = data.tickets
        .filter(t => t.planned_for === day)
        .sort(sortByTimeThenPriority);

      return `<div class="day">
          <span>${weekday} ${day.slice(8)}.${day.slice(5, 7)}.</span>
          <span class="meta">${tickets.length || ""}</span>
        </div>` +
        (tickets.length
          ? tickets.map(t => ticketHTML(t,
              `<button onclick="moveToToday(${t.id})">Do today</button>
               <button onclick="moveToBacklog(${t.id})">To backlog</button>`
            )).join("")
          : `<p class="meta">Nothing planned.</p>`);
    }).join("");


  // ── TIMELINE ──
  renderTimeline();


  // ── PROJECTS ──
  // Each project with its dates, duration, open ticket count, and slip total.
  // Clicking a project opens its edit panel.
  document.getElementById("projectList").innerHTML =
    data.projects.map(p => {
      const myTickets = data.tickets.filter(t => t.project_id === p.id);
      const slips     = myTickets.reduce((sum, t) => sum + t.slips, 0);
      const openCount = myTickets.filter(t => !t.done).length;

      return `<details>
        <summary>
          <b>${esc(p.name)}</b>
          <span class="meta">
            ${p.start_date || "?"} → ${p.deadline || "?"}
            ${projectLength(p) ? "· " + projectLength(p) : ""}
            ${p.deadline ? "· " + daysBetween(today(), p.deadline) + " days left" : ""}
            · ${openCount} open · ${slips} slips
          </span>
        </summary>
        <div class="row">
          <input id="pname-${p.id}" value="${esc(p.name)}" style="flex:1">
        </div>
        <div class="row">
          Start    <input type="date" id="pstart-${p.id}" value="${p.start_date || ""}">
          Deadline <input type="date" id="pend-${p.id}"   value="${p.deadline || ""}">
          <button onclick="saveProject(${p.id})">Save</button>
          <button onclick="deleteProject(${p.id})">Delete</button>
        </div>
      </details>`;
    }).join("") || "<p>No projects yet.</p>";


  // ── BACKLOG ──
  // Tickets with no plan date, grouped by project, highest priority first.
  // Each one can be pulled into today or planned for any date.
  const backlogTickets = openTickets.filter(t => !t.planned_for);
  const groups = [...data.projects, { id: null, name: "No project" }];

  document.getElementById("backlogList").innerHTML =
    `<p class="meta">Tickets with no date wait here. They arrive when added
       without a date, or when moved with "Not today" / "To backlog".
       Pick a date and press Plan to schedule one.</p>` +
    (groups.map(p => {
      const items = backlogTickets
        .filter(t => t.project_id === p.id)
        .sort((a, b) => priority(b) - priority(a));

      if (!items.length) return "";

      return `<h4>${esc(p.name)} (${items.length})</h4>` +
        items.map(t => ticketHTML(t,
          `<button onclick="moveToToday(${t.id})">Do today</button>
           <input type="date" id="plan-${t.id}" value="${addDays(today(), 1)}">
           <button onclick="planFor(${t.id})">Plan</button>`
        )).join("");
    }).join("") || "<p>Backlog is empty.</p>");
}


// ── Timeline: one row per project on a shared date scale ──
// The scale runs from the earliest date to the latest date found
// (project dates, planned tickets, today), and is at least 4 weeks long.
function renderTimeline() {
  const allDates = [
    today(),
    ...data.projects.flatMap(p => [p.start_date, p.deadline]),
    ...data.tickets.map(t => t.planned_for)
  ].filter(Boolean).sort();

  const first     = allDates[0];
  const last      = [allDates[allDates.length - 1], addDays(first, 27)].sort()[1];
  const totalDays = daysBetween(first, last) + 1;

  // Position of a date along the track, as a percentage.
  const x = date => (daysBetween(first, date) / totalDays * 100).toFixed(2) + "%";

  // Scale labels: one per week, fewer when the range is long.
  const step  = 7 * Math.ceil(totalDays / 7 / 8);
  const ticks = [];
  for (let d = first; d <= last; d = addDays(d, step)) {
    ticks.push(`<span style="left:${x(d)}">${d.slice(8)}.${d.slice(5, 7)}</span>`);
  }

  // One row: name, then a track with an optional bar and ticket dots.
  const row = (name, project, tickets) => `
    <div class="tl-row">
      <div class="tl-name" title="${esc(name)}">${esc(name)}</div>
      <div class="tl-track">
        ${(project && project.deadline)
          ? `<div class="tl-bar" style="left:${x(project.start_date || first)};
               width:calc(${x(addDays(project.deadline, 1))} - ${x(project.start_date || first)})"></div>`
          : ""}
        ${tickets.filter(t => t.planned_for).map(t =>
          `<div class="tl-dot ${t.done ? "done" : ""}" style="left:${x(t.planned_for)}"
                title="${t.planned_for} ${shortTime(t.start_time)} ${esc(t.title)}"></div>`
        ).join("")}
        <div class="tl-today" style="left:${x(today())}"></div>
      </div>
    </div>`;

  const unassigned = data.tickets.filter(t => !t.project_id && t.planned_for);

  document.getElementById("timeline").innerHTML =
    `<div class="tl-row"><div></div><div class="tl-scale">${ticks.join("")}</div></div>` +
    data.projects.map(p => row(p.name, p, data.tickets.filter(t => t.project_id === p.id))).join("") +
    (unassigned.length ? row("No project", null, unassigned) : "") +
    `<p class="meta">Bar = start → deadline · dot = planned ticket (grey = done)
       · red line = today · hover a dot for its title</p>`;
}


// ┌──────────────────────────────────────────────────────────────┐
// │  SECTION 9: AUTO-REFRESH                                    │
// │                                                              │
// │  Redraws every 60 seconds so the "in 20 min" badges         │
// │  stay accurate without a page reload.                        │
// │  Skipped while a Details or Edit panel is open, so a         │
// │  half-typed edit isn't wiped.                                │
// └──────────────────────────────────────────────────────────────┘
setInterval(() => {
  if (document.querySelector("#app details[open]")) return;
  if (data.tickets.length) render();
}, 60000);
</script>
